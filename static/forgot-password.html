<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 智能助手</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>忘记密码</h1>
            <p>通过邮箱验证码重置密码</p>
        </div>

        <form id="resetForm" class="auth-form">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" placeholder="请输入邮箱" required>
            </div>

            <div class="form-group code-group">
                <div>
                    <label for="code">验证码</label>
                    <input type="text" id="code" placeholder="请输入验证码" required>
                </div>
                <button type="button" class="auth-button secondary" id="sendCodeBtn">获取验证码</button>
            </div>

            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少6位" required>
            </div>

            <div id="errorMessage" class="error-message" style="display:none;"></div>
            <button type="submit" class="auth-button" id="resetBtn"><span>重置密码</span></button>
        </form>

        <div class="auth-footer">
            <p><a href="/login.html">返回登录</a></p>
        </div>
    </div>
</div>

<script>
const sendCodeBtn = document.getElementById('sendCodeBtn');
const errorMessage = document.getElementById('errorMessage');

sendCodeBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
        errorMessage.textContent = '请输入正确邮箱';
        errorMessage.style.display = 'block';
        return;
    }
    try {
        const resp = await fetch('/api/auth/email/send', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({email, scene: 'reset_password'})
        });
        const data = await resp.json();
        if (data.errno !== 0) throw new Error(data.errmsg || '发送失败');
        errorMessage.style.display = 'none';
    } catch (e) {
        errorMessage.textContent = e.message;
        errorMessage.style.display = 'block';
    }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('code').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const resetBtn = document.getElementById('resetBtn');

    if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
        errorMessage.textContent = '请输入正确邮箱';
        errorMessage.style.display = 'block';
        return;
    }
    if (!code) {
        errorMessage.textContent = '请输入验证码';
        errorMessage.style.display = 'block';
        return;
    }
    if (newPassword.length < 6) {
        errorMessage.textContent = '密码至少6位';
        errorMessage.style.display = 'block';
        return;
    }

    resetBtn.disabled = true;
    resetBtn.innerHTML = '<span>提交中...</span>';
    try {
        const resp = await fetch('/api/auth/password/reset-by-email', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ email, code, new_password: newPassword })
        });
        const data = await resp.json();
        if (data.errno !== 0) throw new Error(data.errmsg || '重置失败');
        alert('密码重置成功，请重新登录');
        window.location.href = '/login.html';
    } catch (e) {
        errorMessage.textContent = e.message;
        errorMessage.style.display = 'block';
    } finally {
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<span>重置密码</span>';
    }
});
</script>
</body>
</html>
