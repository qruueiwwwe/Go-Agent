<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="智能助手 - 注册">
    <title>注册 - 智能助手</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>智能助手</h1>
                <p>创建新账号，开始使用</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
                </div>

                <div class="form-group code-group">
                    <div>
                        <label for="code">验证码</label>
                        <input type="text" id="code" name="code" placeholder="请输入验证码" required>
                    </div>
                    <button type="button" class="auth-button secondary" id="sendCodeBtn">获取验证码</button>
                </div>

                <div class="form-group">
                    <label for="phone">手机号（可选）</label>
                    <input type="text" id="phone" name="phone" placeholder="可选，不填也可注册">
                </div>

                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label for="nickname">昵称（可选）</label>
                    <input type="text" id="nickname" name="nickname" placeholder="请输入昵称">
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码（至少6位）" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="auth-button" id="registerBtn">
                    <span>注册</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>已有账号？ <a href="/login.html">立即登录</a></p>
            </div>
        </div>
    </div>
    
    <script>
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        let countdown = 0;

        sendCodeBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
                errorMessage.textContent = '请输入正确的邮箱';
                errorMessage.style.display = 'block';
                return;
            }
            try {
                const response = await fetch('/api/auth/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, scene: 'register' })
                });
                const result = await response.json();
                if (result.code !== 200) {
                    throw new Error(result.message || '发送失败');
                }
                errorMessage.style.display = 'none';
                countdown = 60;
                sendCodeBtn.disabled = true;
                const timer = setInterval(() => {
                    countdown -= 1;
                    sendCodeBtn.textContent = countdown > 0 ? `${countdown}s` : '获取验证码';
                    if (countdown <= 0) {
                        clearInterval(timer);
                        sendCodeBtn.disabled = false;
                    }
                }, 1000);
            } catch (e) {
                errorMessage.textContent = e.message;
                errorMessage.style.display = 'block';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const code = document.getElementById('code').value.trim();
            const username = document.getElementById('username').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMessage = document.getElementById('errorMessage');
            const registerBtn = document.getElementById('registerBtn');
            
            if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) {
                errorMessage.textContent = '请输入正确的邮箱';
                errorMessage.style.display = 'block';
                return;
            }
            if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
                errorMessage.textContent = '手机号格式不正确';
                errorMessage.style.display = 'block';
                return;
            }
            if (!code) {
                errorMessage.textContent = '请输入验证码';
                errorMessage.style.display = 'block';
                return;
            }
            if (!username) {
                errorMessage.textContent = '请输入用户名';
                errorMessage.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorMessage.textContent = '密码长度至少6位';
                errorMessage.style.display = 'block';
                return;
            }
            if (password !== confirmPassword) {
                errorMessage.textContent = '两次输入的密码不一致';
                errorMessage.style.display = 'block';
                return;
            }
            
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span>注册中...</span>';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/api/auth/register-by-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email,
                        phone,
                        code,
                        username, 
                        password,
                        nickname: nickname || username
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    alert('注册成功，请登录');
                    window.location.href = '/login.html';
                } else {
                    errorMessage.textContent = result.message || '注册失败';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('注册失败:', error);
                errorMessage.textContent = '网络错误，请稍后重试';
                errorMessage.style.display = 'block';
            } finally {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<span>注册</span>';
            }
        });
    </script>
</body>
</html>
